<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flowers for her</title>
  <meta name="description" content="A little calico cat and a bouquet of ASCII lilies.">
  <meta name="theme-color" content="#000000">
  <!-- the page is already dark: stop browser/extension "dark mode" from repainting it
       (that turned the white papers brown) -->
  <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%B8</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <link rel="preload" href="bouquet.webp" as="image">
  <link rel="stylesheet" href="folder.css">
  <style>
    :root {
      color-scheme: dark;
      /* the palette: everything but the flowers */
      --night: #0B132B; --navy: #1C2541; --slate: #3A506B; --sky: #5BC0DE; --peach: #F4D6B0; --amber: #D97706;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: auto;
    }
    #rebloom {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      padding: 10px 26px;
      border: 2px solid var(--sky);
      border-radius: 999px;
      background: rgba(28, 37, 65, 0.6);
      color: var(--peach);
      font: 700 18px/1 "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
      letter-spacing: 0.5px;
      box-shadow: 0 0 18px rgba(91, 192, 222, 0.35);
      backdrop-filter: blur(3px);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0s linear 0.6s,
                  background-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #rebloom.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0s,
                  background-color 0.2s ease, box-shadow 0.2s ease;
    }
    #rebloom:hover {
      background: rgba(58, 80, 107, 0.75);
      box-shadow: 0 0 26px rgba(91, 192, 222, 0.55);
    }
    #rebloom:active { transform: translate(-50%, 2px) scale(0.97); }
    #rebloom:focus-visible { outline: 2px solid var(--peach); outline-offset: 3px; }
    /* "tap to open": browsers only allow music after a tap */
    #gate {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      background: transparent;
      color: var(--peach);
      font: 700 22px/1 "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.5s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #gate[hidden] { display: none; }
    #gate.gone { opacity: 0; }
    #gate .flower { font-size: 54px; animation: beat 1.6s ease-in-out infinite; }
    #gate .hint { text-shadow: 0 0 14px rgba(91, 192, 222, 0.8); animation: glow 1.6s ease-in-out infinite;
                  transition: opacity 0.4s ease; }
    #gate:focus { outline: none; }
    #gate.loading { cursor: default; }
    #gate.loading .hint { opacity: 0; animation: none; }   /* "tap to open" once the music is ready */
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.14); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
    }
    @keyframes glow { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

    /* the opening screen: a folder with the papers inside */
    #welcome {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      padding-bottom: calc(14vh + env(safe-area-inset-bottom));
      box-sizing: border-box;
      font-family: "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
      transition: opacity 0.7s ease;
    }
    #welcome[hidden] { display: none; }
    #welcome.gone { opacity: 0; pointer-events: none; }
    #welcome .folder-tab-text { font-weight: 700; }
    .welcome-hint {
      min-height: 1.2em;
      margin: 0;
      color: var(--peach);
      font: 700 20px/1.2 "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
      letter-spacing: 0.5px;
      text-shadow: 0 0 14px rgba(91, 192, 222, 0.8);
      animation: glow 1.6s ease-in-out infinite;
    }
    .paper {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      font-family: "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
      font-weight: 700;
      color: var(--navy);
    }
    /* "Flowers for her": the real card. Same shape as the Upcoming ones (picture, title and
       badge, two lines, a footer), but with the bouquet, a little note and the song */
    .polaroid { padding: 7% 7% 9%; gap: calc(5px * var(--folder-scale)); }
    .fl-pic {
      position: relative;
      flex: none;
      display: block;
      width: 100%;
      aspect-ratio: 1.5;
      margin-bottom: calc(3px * var(--folder-scale));
      overflow: hidden;
      border-radius: calc(3px * var(--folder-scale));
      background: #000;
      box-shadow: inset 0 0 0 1px rgba(58, 80, 107, 0.14);
    }
    .fl-pic img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 42%;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .fl-pic .up-spark { color: #fff4e6; opacity: 0.9; }
    .up-title.fl-title { font-size: calc(10.4px * var(--folder-scale)); white-space: nowrap; color: var(--navy); }
    .up-badge.fl-badge { background: var(--amber); color: #fff8ef; }
    .fl-desc {
      flex: none;
      font-size: calc(7.6px * var(--folder-scale));
      line-height: 1.3;
      color: var(--slate);
    }
    .fl-foot { justify-content: space-between; }
    .fl-song {
      padding: calc(2px * var(--folder-scale)) calc(6px * var(--folder-scale));
      border-radius: 999px;
      background: rgba(58, 80, 107, 0.12);
      color: var(--slate);
      font-size: calc(7px * var(--folder-scale));
      white-space: nowrap;
    }
    /* "Upcoming" placeholder cards: skeleton blocks with a soft shimmer */
    .upcoming { padding: 7% 7% 9%; gap: calc(5px * var(--folder-scale)); }
    .sk {
      position: relative;
      display: block;
      overflow: hidden;
      border-radius: calc(3px * var(--folder-scale));
      background: #eadccb;
    }
    /* the shimmer is a soft light sliding across. It moves with transform, so the GPU
       animates it alone; moving the background instead repainted the cards every frame */
    .sk::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, rgba(255, 250, 243, 0) 30%, rgba(255, 250, 243, 0.55) 50%, rgba(255, 250, 243, 0) 70%);
      transform: translateX(-100%);
      animation: shimmer 1.8s ease-in-out infinite paused;
      pointer-events: none;
    }
    .folder-root[data-open] .sk::after { animation-play-state: running; }   /* only while you can see them */
    .sk-line { flex: none; height: calc(4.5px * var(--folder-scale)); border-radius: 999px; }
    .up-pic {
      position: relative;
      flex: none;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1.5;
      margin-bottom: calc(3px * var(--folder-scale));
      background: linear-gradient(135deg, #a8def0, var(--sky));
      box-shadow: inset 0 0 0 1px rgba(58, 80, 107, 0.14);
    }
    .up-icon {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 250, 243, 0.6);
      box-shadow: 0 calc(2px * var(--folder-scale)) calc(6px * var(--folder-scale)) rgba(28, 37, 65, 0.18);
      color: var(--slate);
    }
    .up-icon svg { width: 58%; height: 58%; }
    .up-spark { position: absolute; z-index: 1; color: #fbf5ec; line-height: 1; }
    .up-spark.s1 { top: 14%; left: 13%; font-size: calc(8px * var(--folder-scale)); }
    .up-spark.s2 { bottom: 15%; right: 14%; font-size: calc(6px * var(--folder-scale)); opacity: 0.8; }
    .up-row { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .up-title { font-size: calc(11.5px * var(--folder-scale)); color: var(--slate); }
    .up-foot { flex: none; display: flex; align-items: center; gap: calc(5px * var(--folder-scale)); margin-top: auto; }
    .up-bar { flex: 1; height: calc(4px * var(--folder-scale)); border-radius: 999px; background: #eadccb; overflow: hidden; }
    .up-bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f0a54a, var(--amber)); }
    .up-heart { color: var(--amber); font-size: calc(9px * var(--folder-scale)); line-height: 1; white-space: nowrap; }
    .up-badge {
      padding: calc(2px * var(--folder-scale)) calc(6px * var(--folder-scale));
      border-radius: 999px;
      background: rgba(58, 80, 107, 0.12);
      color: var(--slate);
      font-size: calc(7.5px * var(--folder-scale));
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .sk::after { display: none; } }

    /* home: back to the folder, top left */
    #home {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: calc(14px + env(safe-area-inset-left));
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1.5px solid rgba(91, 192, 222, 0.8);
      border-radius: 50%;
      background: rgba(28, 37, 65, 0.6);
      box-shadow: 0 0 12px rgba(91, 192, 222, 0.25);
      backdrop-filter: blur(3px);
      color: var(--peach);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.6s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #home[hidden] { display: none; }
    #home.show { opacity: 0.8; }
    #home.show:hover, #home.show:focus-visible { opacity: 1; background: rgba(58, 80, 107, 0.75); }
    #home:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }
    #home svg { width: 19px; height: 19px; }
    #c { transition: opacity 0.5s ease; }
    #c.leaving { opacity: 0; }

    /* music: mute button + volume slider, top right */
    #sound {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      display: flex;
      align-items: center;
      padding: 3px;
      border: 1.5px solid rgba(91, 192, 222, 0.8);
      border-radius: 999px;
      background: rgba(28, 37, 65, 0.6);
      box-shadow: 0 0 12px rgba(91, 192, 222, 0.25);
      backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #sound[hidden] { display: none; }
    #sound.show { opacity: 0.8; }
    #sound.show:hover, #sound.show:focus-within { opacity: 1; }
    #mute {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--peach);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #mute:hover { background: rgba(58, 80, 107, 0.7); }
    #mute:focus-visible { outline: 2px solid var(--peach); outline-offset: 1px; }
    #mute svg { width: 20px; height: 20px; overflow: visible; }
    #mute .spk { fill: currentColor; }
    #mute .w1, #mute .w2, #mute .x { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    #sound .x, #sound[data-level="0"] .w1, #sound[data-level="0"] .w2, #sound[data-level="1"] .w2 { display: none; }
    #sound[data-level="0"] .x { display: inline; }
    #volume {
      -webkit-appearance: none;
      appearance: none;
      width: 0;
      height: 4px;
      margin: 0;
      border-radius: 2px;
      background: linear-gradient(to right, var(--sky) var(--v, 70%), var(--slate) var(--v, 70%));
      opacity: 0;
      visibility: hidden;            /* collapsed: the knob must not peek out either */
      cursor: pointer;
      transition: width 0.25s ease, margin 0.25s ease, opacity 0.25s ease, visibility 0s linear 0.25s;
    }
    #sound:hover #volume, #sound:focus-within #volume {
      width: 84px; margin: 0 10px 0 4px; opacity: 1; visibility: visible;
      transition: width 0.25s ease, margin 0.25s ease, opacity 0.25s ease, visibility 0s;
    }
    @media (hover: none) {           /* phones: no hover, so the slider is always there */
      #volume { width: 72px; margin: 0 10px 0 4px; opacity: 1; visibility: visible; }
    }
    /* muted: dim the slider, but only while it's open */
    #sound.muted #volume { filter: grayscale(1); }
    #sound.muted:hover #volume, #sound.muted:focus-within #volume { opacity: 0.5; }
    @media (hover: none) { #sound.muted #volume { opacity: 0.5; } }
    #sound.no-slider #volume { display: none; }
    #volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--peach);
      border: 2px solid var(--slate);
    }
    #volume::-moz-range-thumb {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--peach);
      border: 2px solid var(--slate);
    }
    #volume:focus { outline: none; }
    #volume:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(244, 214, 176, 0.6); }

    /* the YouTube player that plays the song: always invisible, never catches taps */
    #yt {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 200px;
      height: 200px;
      margin: -100px 0 0 -100px;
      opacity: 0;
      pointer-events: none;
    }
    #yt[hidden] { display: none; }
    #yt iframe { display: block; width: 100%; height: 100%; border: 0; }

    noscript {
      color: var(--peach);
      font: 16px/1.5 system-ui, sans-serif;
      padding: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="c" role="img" aria-label="A calico cat says hello, then a bouquet of lilies blooms"></canvas>
  <button id="rebloom" type="button">Re-bloom</button>
  <button id="gate" type="button" hidden><span class="flower" aria-hidden="true">🌸</span><span class="hint">tap to open</span></button>
  <button id="home" type="button" hidden aria-label="Back to the folder" title="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 11 12 4l8.5 7"/>
      <path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/>
    </svg>
  </button>
  <div id="sound" hidden data-level="2">
    <button id="mute" type="button" aria-label="Mute music" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="spk" d="M3 9h4l5-4.5v15L7 15H3z"/>
        <path class="w1" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>
        <path class="w2" d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
        <path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
    </button>
    <input id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Music volume">
  </div>
  <div id="yt"><div id="yt-player"></div></div>
  <div id="welcome" hidden></div>
  <noscript>This little bouquet needs JavaScript to bloom.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="folder.js"></script>
  <script src="welcome.js"></script>
  <script src="flowers.js"></script>
</body>
</html>
